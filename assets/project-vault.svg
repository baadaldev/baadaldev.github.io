<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="vaultBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="70%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#00bbf9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="valyrianDoor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a4759"/>
      <stop offset="40%" stop-color="#1e2530"/>
      <stop offset="80%" stop-color="#2c3645"/>
      <stop offset="100%" stop-color="#12161f"/>
    </linearGradient>
    <linearGradient id="brassSpokes" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#553d04"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#vaultBg)"/>

  <!-- Vault Wall Plates with Rivets -->
  <rect x="20" y="20" width="560" height="320" rx="8" fill="none" stroke="#2a3444" stroke-width="2"/>
  <!-- Rivets -->
  <g fill="#4a5568">
    <circle cx="35" cy="35" r="4"/><circle cx="565" cy="35" r="4"/>
    <circle cx="35" cy="325" r="4"/><circle cx="565" cy="325" r="4"/>
    <circle cx="300" cy="35" r="4"/><circle cx="300" cy="325" r="4"/>
  </g>

  <!-- The Great Circular Vault Door -->
  <g transform="translate(300, 180)">
    <!-- Outer Vault Ring with Heavy Bolts -->
    <circle cx="0" cy="0" r="140" fill="url(#valyrianDoor)" stroke="#4a5b73" stroke-width="8"/>
    <!-- Outer Gear Teeth / Vault Latches -->
    <g fill="#2d3748" stroke="#4a5b73" stroke-width="2">
      <rect x="-12" y="-155" width="24" height="20" rx="3"/>
      <rect x="-12" y="135" width="24" height="20" rx="3"/>
      <rect x="-155" y="-12" width="20" height="24" rx="3"/>
      <rect x="135" y="-12" width="20" height="24" rx="3"/>
      <g transform="rotate(45)">
        <rect x="-12" y="-155" width="24" height="20" rx="3"/>
        <rect x="-12" y="135" width="24" height="20" rx="3"/>
        <rect x="-155" y="-12" width="20" height="24" rx="3"/>
        <rect x="135" y="-12" width="20" height="24" rx="3"/>
      </g>
    </g>

    <!-- Mid Dial with Cryptographic Runes -->
    <circle cx="0" cy="0" r="115" fill="#141a24" stroke="url(#brassSpokes)" stroke-width="4"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7"/>

    <!-- 6 Heavy Vault Spokes / Wheels -->
    <g stroke="url(#brassSpokes)" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-95" x2="0" y2="95"/>
      <line x1="-82" y1="-48" x2="82" y2="48"/>
      <line x1="-82" y1="48" x2="82" y2="-48"/>
    </g>

    <!-- Core Vault Lock with Web3 / Ethereum Style Diamond Geometry -->
    <circle cx="0" cy="0" r="75" fill="url(#cyanCore)"/>
    <circle cx="0" cy="0" r="50" fill="#0d1117" stroke="#00f5d4" stroke-width="3"/>

    <!-- Central Glowing Ethereum / Valyrian Crystal Polyhedron -->
    <g transform="scale(0.85)">
      <!-- Top Diamond Half -->
      <polygon points="0,-45 -25,0 0,10" fill="#00f5d4" opacity="0.9"/>
      <polygon points="0,-45 25,0 0,10" fill="#70e000" opacity="0.75"/>
      <polygon points="0,-45 0,10 0,0" fill="#ffffff" opacity="0.95"/>
      <!-- Bottom Diamond Half -->
      <polygon points="0,16 -25,5 0,45" fill="#00bbf9" opacity="0.85"/>
      <polygon points="0,16 25,5 0,45" fill="#0077b6" opacity="0.7"/>
    </g>
  </g>
</svg>
