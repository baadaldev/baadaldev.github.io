<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="ravenNight" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="60%" stop-color="#070d18"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="silverGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#a3c4f3"/>
      <stop offset="100%" stop-color="#4a6fa5"/>
    </linearGradient>
    <filter id="moonBlur">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#ravenNight)"/>

  <!-- Full Moon with Blue Glow -->
  <circle cx="300" cy="150" r="100" fill="#000" opacity="0.2"/>
  <circle cx="300" cy="150" r="90" fill="#d9e6f2" filter="url(#moonBlur)" opacity="0.35"/>
  <circle cx="300" cy="150" r="85" fill="#f0f6fc"/>
  <!-- Craters -->
  <circle cx="270" cy="130" r="15" fill="#d0dbe5" opacity="0.6"/>
  <circle cx="330" cy="170" r="22" fill="#d0dbe5" opacity="0.5"/>
  <circle cx="320" cy="115" r="10" fill="#d0dbe5" opacity="0.4"/>

  <!-- Network Constellation / Cryptographic Nodes -->
  <g stroke="#64b5f6" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,4">
    <line x1="80" y1="80" x2="160" y2="130"/>
    <line x1="160" y1="130" x2="220" y2="90"/>
    <line x1="220" y1="90" x2="300" y2="150"/>
    <line x1="300" y1="150" x2="390" y2="90"/>
    <line x1="390" y1="90" x2="480" y2="140"/>
    <line x1="480" y1="140" x2="540" y2="80"/>
    <line x1="160" y1="130" x2="210" y2="220"/>
    <line x1="390" y1="90" x2="430" y2="210"/>
  </g>
  <!-- Constellation Dots -->
  <g fill="#90caf9">
    <circle cx="80" cy="80" r="3"/>
    <circle cx="160" cy="130" r="4"/>
    <circle cx="220" cy="90" r="3"/>
    <circle cx="390" cy="90" r="4"/>
    <circle cx="480" cy="140" r="3.5"/>
    <circle cx="540" cy="80" r="3"/>
    <circle cx="210" cy="220" r="3.5"/>
    <circle cx="430" cy="210" r="3.5"/>
  </g>

  <!-- Giant Raven in Flight Silhouette -->
  <g transform="translate(180, 70) scale(1.1)" fill="#0d1117" stroke="#1f2937" stroke-width="1.5">
    <!-- Body & Head -->
    <path d="M 100 80 Q 120 70 140 78 Q 155 75 165 70 Q 155 83 145 88 Q 130 115 100 130 Q 75 140 40 145 Q 60 120 75 105 Z"/>
    <!-- Beak -->
    <polygon points="165,70 185,73 160,82" fill="#1f2937"/>
    <!-- Left Wing Raised -->
    <path d="M 105 85 C 90 20 40 -10 -20 10 C 20 30 50 65 85 95 C 40 85 10 95 -15 110 C 25 105 55 115 80 120 Z"/>
    <!-- Right Wing Behind -->
    <path d="M 125 80 C 135 30 170 0 220 5 C 190 25 170 50 140 85 Z" opacity="0.8"/>
    <!-- Tail Feathers -->
    <polygon points="40,145 10,180 35,160 15,190 50,155" fill="#0d1117"/>
    <!-- Glowing Eye -->
    <circle cx="152" cy="76" r="2.5" fill="#64b5f6"/>
  </g>

  <!-- Cold Winter Mist / Trees Silhouette -->
  <path d="M 0 360 L 0 300 Q 50 280 100 305 Q 160 320 220 295 Q 300 270 380 310 Q 480 325 600 290 L 600 360 Z" fill="#05080f"/>
  <!-- Pine silhouettes -->
  <polygon points="40,300 48,260 56,300" fill="#090d16"/>
  <polygon points="70,310 80,250 90,310" fill="#080c14"/>
  <polygon points="510,310 520,255 530,310" fill="#090d16"/>
  <polygon points="545,300 555,240 565,300" fill="#080c14"/>
</svg>
